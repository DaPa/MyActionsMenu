<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bulbGradient" x1="12" y1="5" x2="28" y2="26" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFF176"/>
            <stop offset="45%" stop-color="#FFD54F"/>
            <stop offset="100%" stop-color="#FFB300"/>
        </linearGradient>
        <linearGradient id="baseGradient" x1="14" y1="26" x2="26" y2="33" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#94A3B8"/>
            <stop offset="40%" stop-color="#E2E8F0"/>
            <stop offset="70%" stop-color="#94A3B8"/>
            <stop offset="100%" stop-color="#64748B"/>
        </linearGradient>
        <filter id="bulbGlow" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="1" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Light Rays -->
    <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
        <path d="M20 1.5V3.5"/>
        <path d="M28.5 5L30.5 3"/>
        <path d="M32.5 15H35"/>
        <path d="M28.5 23L31 24.5"/>
        <path d="M11.5 23L9 24.5"/>
        <path d="M7.5 15H5"/>
        <path d="M11.5 5L9.5 3"/>
    </g>

    <!-- Bulb Glass Body -->
    <path d="M20 5C14.477 5 10 9.477 10 15C10 19.5 13 22.5 15 26H25C27 22.5 30 19.5 30 15C30 9.477 25.523 5 20 5Z"
          fill="url(#bulbGradient)"
          stroke="#D97706"
          stroke-width="1.2"
          stroke-linejoin="round"/>

    <!-- Filament -->
    <path d="M17.5 25V20L19 16.5C19.3 15 20.7 15 21 16.5L22.5 20V25"
          fill="none"
          stroke="#D97706"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="20" cy="15" r="1.5" fill="#FFF9C4" stroke="#D97706" stroke-width="0.8"/>

    <!-- Glossy Highlight Reflection -->
    <path d="M13.5 12C14.5 9 17 7 19.5 7"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.8"
          stroke-linecap="round"
          opacity="0.75"/>

    <!-- Screw Base Threads -->
    <rect x="14" y="26" width="12" height="3" rx="1.5" fill="url(#baseGradient)" stroke="#64748B" stroke-width="0.6"/>
    <rect x="15" y="29.5" width="10" height="3" rx="1.5" fill="url(#baseGradient)" stroke="#64748B" stroke-width="0.6"/>

    <!-- Bottom Contact -->
    <path d="M17 33H23C23 34.5 22 36 20 36C18 36 17 34.5 17 33Z"
          fill="#475569"
          stroke="#334155"
          stroke-width="0.6"/>
</svg>